# Example workspace.conf for a Rails app plus a queue worker (see README.md).
WS_NAME=shop
WS_PREFIX=shop
WS_NETWORK=shop-dev-net
WS_REMOTE=git@github.com:example
WS_CHECKOUT=~/Code/shop-workspace
WS_BASE_BRANCH=main

WS_DEVCONTAINER_CLI="npx -y @devcontainers/cli@0.89.0"
WS_DEFAULT_SHELL=zsh
WS_INFRA_SERVICES="mailpit garage postgres redis"

WS_LANE_SLOTS=4
WS_LANE_RESOURCES="postgres redis"
WS_LANE_VAR=
# Refuse lanes on branches whose database.yml ignores the lane.
WS_LANE_GUARDS="app:config/database.yml:WS_LANE"
# Dev secrets, the master key, and the local secret base must match in every lane.
WS_LANE_LINKS="app:.env.development.local app:config/master.key app:tmp/local_secret.txt"

WS_PG_DATABASES="shop_development shop_development_cable shop_test"
WS_PG_CREATE=0                      # lanes.d/setup runs db:prepare

WS_REDIS_URL=redis://redis:6379
WS_REDIS_ENV=REDIS_URL

# --- webhook-forward module ---
WS_WEBHOOK_PROJECT=app
WS_STRIPE_ENV_FILE=.env.development.local
WS_STRIPE_FORWARD=connect

# Catches all development email (mail-catcher module). Nothing is delivered to
# real recipients. Every lane shares this inbox.
services:
  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - "{{PORT:1025}}:1025"   # SMTP
      - "{{PORT:8025}}:8025"   # Web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

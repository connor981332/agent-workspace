# Shared development infrastructure for every {{TITLE}} project.
#
# One Compose project, "{{PREFIX}}-infra", so each service exists exactly once
# no matter which dev container starts first. Every project's initializeCommand
# runs bin/devcontainer-init, which brings this up when a service in
# WS_INFRA_SERVICES isn't running; when everything is up, that is a no-op.
# Modules add services as infra/compose.d/*.yaml; `bin/ws infra ...` runs
# Compose with all of them.
#
# Containers reach these services by name on {{PREFIX}}-dev-net
# (postgres:5432, redis:6379). Host ports are offset by {{PORT_OFFSET}} from the
# defaults so this workspace can run beside others on the same machine.
#
# Keep the project name and volume keys unchanged: renaming a volume starts an
# empty database. Lanes share these servers and get their own databases on them
# (bin/lane, lib/ws/resources).
name: {{PREFIX}}-infra

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "{{PORT:5432}}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "{{PORT:6379}}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

networks:
  default:
    name: {{PREFIX}}-dev-net
    external: true

# Workspace settings, read by bin/ws, bin/lane, bin/bootstrap, and
# bin/devcontainer-init. Plain sh: VAR=value lines, no commands. The workspace
# owns this file; `kit update` never touches it. Every setting is documented in
# docs/configuration.md of the agent-workspace candidate this came from.

# --- Identity ----------------------------------------------------------------
WS_NAME={{NAME}}                    # short, lowercase; names snapshots and mounts
WS_PREFIX={{PREFIX}}                # shared infra runs as Compose project <prefix>-infra
WS_NETWORK={{PREFIX}}-dev-net       # every container joins this network
WS_REMOTE={{REMOTE}}                # bin/bootstrap clones $WS_REMOTE/<directory>.git
WS_CHECKOUT={{CHECKOUT}}            # the one host path this workspace lives at
WS_BASE_BRANCH={{BASE_BRANCH}}      # new lane branches start from origin/<this>

# --- Containers --------------------------------------------------------------
WS_DEVCONTAINER_CLI="npx -y @devcontainers/cli@0.89.0"
WS_DEFAULT_SHELL=sh                 # what `bin/ws <alias>` opens with no command
# Long-running services in infra/ (not one-shot jobs). When all of them run, a
# container start skips Compose. Modules append theirs. Empty: always run Compose.
WS_INFRA_SERVICES="postgres redis"

# --- Lanes -------------------------------------------------------------------
WS_LANE_SLOTS=4                     # concurrent lanes; ports are base + slot
WS_LANE_RESOURCES="postgres redis"  # adapters in lib/ws/resources or lanes.d/resources
WS_LANE_VAR=                        # also export the lane name under this name (e.g. APP_LANE)
# <alias>:<file>:<text> ... A lane worktree whose <file> lacks <text> predates
# lane support and is refused, so it can't use the main checkout's data.
WS_LANE_GUARDS=""
# <alias>:<path> ... Gitignored files every lane links from the main checkout
# (dev secrets, master keys), so sessions and encrypted data read the same.
WS_LANE_LINKS=""

# --- postgres lane resource (lib/ws/resources/postgres.sh) -------------------
WS_PG_DATABASES="{{NAME}}_development {{NAME}}_test"
WS_PG_CREATE=1                      # 0 when lanes.d/setup prepares them (db:prepare)

# --- redis lane resource (lib/ws/resources/redis.sh) -------------------------
WS_REDIS_URL=redis://redis:6379
WS_REDIS_ENV=REDIS_URL

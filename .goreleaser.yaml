# GoReleaser configuration (plans/release-candidate.md §6). CI runs `goreleaser check` and a
# snapshot build on every PR; .github/workflows/release.yml publishes a tag's release.
version: 2

project_name: aw

builds:
  - id: aw
    main: ./cmd/aw
    binary: aw
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/connor981332/agent-workspace/internal/cli.version={{ .Version }}
    # Reproducible: the binaries' timestamps come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Raw binaries, so the launcher needs no tar: aw_<version>_<os>_<arch>.
  - id: aw
    formats: [binary]
    name_template: "aw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless Sigstore signature of checksums.txt, through GitHub OIDC (§6). The launcher and install.sh
# verify it when cosign is installed.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  disable: true

# The release workflow sets AW_CONFIG_SCHEMA and AW_STATE_SCHEMA from the built binary's
# aw version --json, so the notes state all three versions (§6).
release:
  github:
    owner: connor981332
    name: agent-workspace
  # Until 1.0, every release is a pre-release (§6, §7).
  prerelease: "true"
  draft: false
  extra_files:
    - glob: ./install.sh
  header: |
    aw {{ .Version }}: configuration schema {{ .Env.AW_CONFIG_SCHEMA }}, state schema {{ .Env.AW_STATE_SCHEMA }}.

    The assets are raw binaries for Linux and macOS on amd64 and arm64, checksums.txt (SHA-256) with
    its Sigstore bundle, and install.sh. Build provenance is attested: gh attestation verify <file>
    --repo connor981332/agent-workspace.
    A workspace pins this version in .aw/version, and bin/aw fetches and verifies the binary.

# Catches all development email (mail-catcher module). Nothing is delivered to
# real recipients. Each lane sends with its own SMTP username, which tags its mail.
services:
  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_TAGS_USERNAME: "true"
    ports:
      - "{{PORT:1025}}:1025"   # SMTP
      - "{{PORT:8025}}:8025"   # Web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

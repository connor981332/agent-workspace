# A shared Postgres (postgres module). Lanes get their own databases on it through a provider.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "{{PORT:5432}}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

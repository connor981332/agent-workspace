# CI for the Go release candidate (plans/release-candidate.md §7). It runs alongside candidates.yml,
# which is left unchanged until the candidates are archived.
name: Go

on:
  push:
    branches: [master]
    paths-ignore:
      - 'workspace-candidate-*/**'
  pull_request:
    # "edited" reruns the checks when the description changes, for the hot-path check.
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - 'workspace-candidate-*/**'

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STATICCHECK_VERSION: v0.8.2 # staticcheck 2026.2.2

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' ':!:workspace-candidate-*'))
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff && (cd acceptance && go mod tidy -diff)
      - name: go vet
        run: go vet ./... && (cd acceptance && go vet ./...)
      - name: staticcheck
        run: |
          go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
          cd acceptance && go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: Acceptance suite imports nothing from the main module (§3.2)
        working-directory: acceptance
        run: go test -count=1 -run TestNoImportsFromTheMainModule .
      - name: Dependency direction (§4.3)
        run: go test -count=1 ./internal/archtest
      - name: Hot path section (§5.4)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh .github/scripts/check-hot-path.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  release-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean
      - name: Check the assets
        run: sh .github/scripts/check-release-assets.sh dist
      - name: Keep the first build's checksums
        run: cp dist/checksums.txt "$RUNNER_TEMP/first.txt"
      - name: Build again
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean
      - name: Reproducible
        run: diff "$RUNNER_TEMP/first.txt" dist/checksums.txt && echo "Two builds gave identical binaries."

  unit:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04 # linux/amd64
          - ubuntu-24.04-arm # linux/arm64
          - macos-15 # darwin/arm64
          - macos-15-intel # darwin/amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Platform
        run: go version && go env GOOS GOARCH
      - name: go test -race
        run: go test -race ./...

  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            acceptance/go.sum
      - name: Git and shells
        run: git --version
      - name: BusyBox, for the launcher's shell matrix (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq busybox >/dev/null
          busybox | head -1
          command -v dash bash
      - name: Acceptance suite and coverage check (§3)
        working-directory: acceptance
        run: go test -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/acceptance.log"; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: Summary
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/acceptance.log"
          [ -f "$log" ] || exit 0
          {
            echo "### Acceptance on ${{ matrix.os }}"
            echo
            echo "| Result | Count |"
            echo "|---|---|"
            for r in PASS FAIL SKIP; do
              echo "| $r | $(grep -cE "^ *--- $r: TestScenarios/[^/]+/" "$log" || true) |"
            done
            echo
            echo "Skipped scenarios are pending: their milestone is later than \`current\` in acceptance/requirements.toml."
          } >> "$GITHUB_STEP_SUMMARY"

  # Latency budgets (§5.2): absolute on ubuntu-24.04, and regressions against master on macos-15,
  # whose virtual machines cannot hold an absolute budget (docs/dev/spikes.md). Master's binary is
  # built in the same job and measured interleaved with this one, so that the noise of a shared
  # machine affects both alike. Each run's results are kept as an artifact.
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            mode: absolute
          - os: macos-15
            mode: relative
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            acceptance/go.sum
      - name: Build master's aw, the baseline
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "No baseline commit"; exit 0
          fi
          git fetch -q --depth=1 origin "$BASE"
          git worktree add -q "$RUNNER_TEMP/baseline-src" "$BASE"
          (cd "$RUNNER_TEMP/baseline-src" && CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X github.com/connor981332/agent-workspace/internal/cli.version=0.0.0-bench-baseline" \
            -o "$RUNNER_TEMP/aw-baseline" ./cmd/aw)
          echo "Baseline: $BASE"
      - name: Bench
        working-directory: acceptance
        shell: bash
        env:
          AW_BENCH_HOST: ${{ matrix.os }}
        run: |
          args=(-on ci -mode "${{ matrix.mode }}" -out "$RUNNER_TEMP/bench.json")
          if [ -x "$RUNNER_TEMP/aw-baseline" ]; then args+=(-baseline-aw "$RUNNER_TEMP/aw-baseline");
          elif [ "${{ matrix.mode }}" = relative ]; then args=(-on ci -mode absolute -out "$RUNNER_TEMP/bench.json"); echo "No baseline: reporting only"; fi
          set +e
          go run ./bench "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          if [ "${{ matrix.mode }}" = relative ] && [ ! -x "$RUNNER_TEMP/aw-baseline" ]; then status=0; fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: ignore

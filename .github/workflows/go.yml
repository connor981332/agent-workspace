# CI (plans/release-candidate.md §7).
name: Go

on:
  push:
    branches: [master]
  pull_request:
    # "edited" reruns the checks when the description changes, for the hot-path check.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STATICCHECK_VERSION: v0.8.2 # staticcheck 2026.2.2

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff && (cd acceptance && go mod tidy -diff)
      - name: go vet
        run: go vet ./... && (cd acceptance && go vet ./...)
      - name: staticcheck
        run: |
          go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
          cd acceptance && go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: Acceptance suite imports nothing from the main module (§3.2)
        working-directory: acceptance
        run: go test -count=1 -run TestNoImportsFromTheMainModule .
      - name: Dependency direction (§4.3)
        run: go test -count=1 ./internal/archtest
      - name: Hot path section (§5.4)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh .github/scripts/check-hot-path.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  release-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean --skip=sign
      - name: Check the assets
        run: sh .github/scripts/check-release-assets.sh dist
      - name: Keep the first build's checksums
        run: cp dist/checksums.txt "$RUNNER_TEMP/first.txt"
      - name: Build again
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean --skip=sign
      - name: Reproducible
        run: diff "$RUNNER_TEMP/first.txt" dist/checksums.txt && echo "Two builds gave identical binaries."

  unit:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04 # linux/amd64
          - ubuntu-24.04-arm # linux/arm64
          - macos-15 # darwin/arm64
          - macos-15-intel # darwin/amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Platform
        run: go version && go env GOOS GOARCH
      - name: go test -race
        run: go test -race ./...

  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            acceptance/go.sum
      - name: Git and shells
        run: git --version
      - name: BusyBox, for the launcher's shell matrix (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq busybox >/dev/null
          busybox | head -1
          command -v dash bash
      - name: Acceptance suite and coverage check (§3)
        working-directory: acceptance
        run: go test -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/acceptance.log"; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: Summary
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/acceptance.log"
          [ -f "$log" ] || exit 0
          {
            echo "### Acceptance on ${{ matrix.os }}"
            echo
            echo "| Result | Count |"
            echo "|---|---|"
            for r in PASS FAIL SKIP; do
              echo "| $r | $(grep -cE "^ *--- $r: TestScenarios/[^/]+/" "$log" || true) |"
            done
            echo
            echo "Skipped scenarios are pending: their milestone is later than \`current\` in acceptance/requirements.toml."
          } >> "$GITHUB_STEP_SUMMARY"

  # The Git versions the ref hook and lanes must work with (plan §7, risk 3). Guards decide on what
  # Git does, so the oldest supported Git gates a milestone as much as the newest. Scenarios run as
  # an ordinary user, as they do everywhere else: some depend on file permissions.
  git-versions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "2.34", image: "ubuntu:22.04", latest: false }
          - { name: "2.39", image: "debian:bookworm", latest: false }
          - { name: latest, image: "ubuntu:24.04", latest: true }
    name: git-versions (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    steps:
      - name: Install Git
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl tar gzip git >/dev/null
          if [ "${{ matrix.latest }}" = true ]; then
            apt-get install -y -qq software-properties-common >/dev/null
            add-apt-repository -y ppa:git-core/ppa >/dev/null
            apt-get update -qq
            apt-get install -y -qq git >/dev/null
          fi
          git --version
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Ref hook, lane and sweep scenarios
        run: |
          useradd -m tester
          chown -R tester .
          su tester -c "cd acceptance && PATH='$PATH' GOCACHE=/tmp/gocache GOMODCACHE=/tmp/gomod go test -count=1 -run 'TestScenarios/^(policy|lanes|sweep)\$' ."

  # Speed on CI (§5.2): regressions against master, on the median, and the guard budgets on Linux.
  # Absolute budgets are checked on a maintainer's laptop, because a shared machine's disk and
  # neighbours decide the tail here. Master's binary is built in the same job and measured
  # interleaved with this one, so that the noise affects both alike. Each run's results are kept
  # as an artifact.
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Medians need fewer samples than a p99, and every sample is taken twice (this binary and
          # master's). On macOS at full scale the job took over 15 minutes.
          - os: ubuntu-24.04
            guard: true
            scale: 0.5
          - os: macos-15
            guard: false
            scale: 0.3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            acceptance/go.sum
      - name: Build master's aw, the baseline
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "No baseline commit"; exit 0
          fi
          git fetch -q --depth=1 origin "$BASE"
          git worktree add -q "$RUNNER_TEMP/baseline-src" "$BASE"
          (cd "$RUNNER_TEMP/baseline-src" && CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X github.com/connor981332/agent-workspace/internal/cli.version=0.0.0-bench-baseline" \
            -o "$RUNNER_TEMP/aw-baseline" ./cmd/aw)
          echo "Baseline: $BASE"
      - name: Bench
        working-directory: acceptance
        shell: bash
        env:
          AW_BENCH_HOST: ${{ matrix.os }}
        run: |
          args=(-mode relative -scale "${{ matrix.scale }}" -out "$RUNNER_TEMP/bench.json")
          if [ "${{ matrix.guard }}" = true ]; then args+=(-guard-budgets); fi
          if [ -x "$RUNNER_TEMP/aw-baseline" ]; then args+=(-baseline-aw "$RUNNER_TEMP/aw-baseline");
          else args=(-mode absolute -scale "${{ matrix.scale }}" -out "$RUNNER_TEMP/bench.json"); echo "No baseline: reporting only"; fi
          set +e
          go run ./bench "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          if [ ! -x "$RUNNER_TEMP/aw-baseline" ]; then status=0; fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: ignore

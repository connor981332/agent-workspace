# CI for the Go release candidate (plans/release-candidate.md §7). It runs alongside candidates.yml,
# which is left unchanged until the candidates are archived.
name: Go

on:
  push:
    branches: [master]
    paths-ignore:
      - 'workspace-candidate-*/**'
  pull_request:
    # "edited" reruns the checks when the description changes, for the hot-path check.
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - 'workspace-candidate-*/**'

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STATICCHECK_VERSION: v0.8.2 # staticcheck 2026.2.2

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' ':!:workspace-candidate-*'))
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff && (cd acceptance && go mod tidy -diff)
      - name: go vet
        run: go vet ./... && (cd acceptance && go vet ./...)
      - name: staticcheck
        run: |
          go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
          cd acceptance && go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: Acceptance suite imports nothing from the main module (§3.2)
        working-directory: acceptance
        run: go test -count=1 -run TestNoImportsFromTheMainModule .
      - name: Dependency direction (§4.3)
        run: go test -count=1 ./internal/archtest
      - name: Hot path section (§5.4)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh .github/scripts/check-hot-path.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  release-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean
      - name: Check the assets
        run: sh .github/scripts/check-release-assets.sh dist
      - name: Keep the first build's checksums
        run: cp dist/checksums.txt "$RUNNER_TEMP/first.txt"
      - name: Build again
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean
      - name: Reproducible
        run: diff "$RUNNER_TEMP/first.txt" dist/checksums.txt && echo "Two builds gave identical binaries."

  unit:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04 # linux/amd64
          - ubuntu-24.04-arm # linux/arm64
          - macos-15 # darwin/arm64
          - macos-15-intel # darwin/amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Platform
        run: go version && go env GOOS GOARCH
      - name: go test -race
        run: go test -race ./...

  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            acceptance/go.sum
      - name: Git and shells
        run: git --version
      - name: BusyBox, for the launcher's shell matrix (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq busybox >/dev/null
          busybox | head -1
          command -v dash bash
      - name: Acceptance suite and coverage check (§3)
        working-directory: acceptance
        run: go test -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/acceptance.log"; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: Summary
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/acceptance.log"
          [ -f "$log" ] || exit 0
          {
            echo "### Acceptance on ${{ matrix.os }}"
            echo
            echo "| Result | Count |"
            echo "|---|---|"
            for r in PASS FAIL SKIP; do
              echo "| $r | $(grep -cE "^ *--- $r: TestScenarios/[^/]+/" "$log" || true) |"
            done
            echo
            echo "Skipped scenarios are pending: their milestone is later than \`current\` in acceptance/requirements.toml."
          } >> "$GITHUB_STEP_SUMMARY"

  # Latency budgets (§5.2): absolute on ubuntu-24.04, regressions against master on macos-15, whose
  # virtual machines cannot hold an absolute budget (docs/dev/spikes.md). Results from master are
  # kept as artifacts; each run compares with master's last.
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            mode: absolute
          - os: macos-15
            mode: relative
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            acceptance/go.sum
      - name: Master's last results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow go.yml --branch master --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n "bench-${{ matrix.os }}" -D "$RUNNER_TEMP/baseline"; then
            echo "Baseline from run $id"
          else
            echo "No baseline from master yet"
          fi
      - name: Bench
        working-directory: acceptance
        shell: bash
        env:
          AW_BENCH_HOST: ${{ matrix.os }}
        run: |
          args=(-mode "${{ matrix.mode }}" -out "$RUNNER_TEMP/bench.json")
          if [ -f "$RUNNER_TEMP/baseline/bench.json" ]; then args+=(-baseline "$RUNNER_TEMP/baseline/bench.json"); fi
          go run ./bench "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: ignore

# Shared CI for every workspace-candidate-* directory. A candidate opts in by adding an
# executable ci.sh at its root. Candidates run independently, so one failing cannot hide another.
name: Candidates

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.find.outputs.candidates }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          list=$(find . -maxdepth 2 -path './workspace-candidate-*/ci.sh' -printf '%h\n' | sed 's|^\./||' | sort \
            | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')
          echo "candidates=$list" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: needs.discover.outputs.candidates != '[]'
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.candidates) }}
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure Git identity for fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Run ${{ matrix.candidate }}
        run: sh "${{ matrix.candidate }}/ci.sh"

# The release workflow (plans/release-candidate.md §6). On a v* tag it builds with GoReleaser and
# publishes a GitHub Release, then runs the acceptance suite on all four platforms against the
# published assets, downloaded as a user's launcher would get them.
#
# The publish job uses the protected "release" environment: a maintainer approves each release
# before anything is published.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write # keyless signing, and attestations
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The tag is a version on master
        run: |
          case "$GITHUB_REF_NAME" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          git fetch -q origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::$GITHUB_REF_NAME is not on master"; exit 1; }
      - name: The milestone's budgets were measured on a laptop
        # CI only checks for regressions, so this is where the absolute budgets are enforced
        # (speed.md, "Enforcement").
        run: |
          milestone=$(sed -n 's/^current = "\(.*\)"/\1/p' acceptance/requirements.toml)
          awk -v m="## $milestone" '$0 == m { on = 1; next } /^## / { on = 0 } on' docs/dev/benchmarks.md > "$RUNNER_TEMP/section"
          section=$RUNNER_TEMP/section # outside the checkout: GoReleaser refuses a dirty tree
          if ! grep -q '^### Linux laptop, ' "$section" || ! grep -q '| hook |' "$section" || grep -q '\*\*FAIL\*\*' "$section"; then
            echo "docs/dev/benchmarks.md has no passing Linux laptop result for $milestone: run the bench and record it first" >&2
            exit 1
          fi
      - name: Schema versions for the release notes
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aw" ./cmd/aw
          "$RUNNER_TEMP/aw" version --json | tee "$RUNNER_TEMP/version.json"
          python3 - "$RUNNER_TEMP/version.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          v = json.load(open(sys.argv[1]))
          print(f"AW_CONFIG_SCHEMA={v['config_schema']}")
          print(f"AW_STATE_SCHEMA={v['state_schema']}")
          PY
      - uses: sigstore/cosign-installer@v4.1.3
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Check the assets
        run: sh .github/scripts/check-release-assets.sh dist
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/assets/aw_*

  # The published assets, as downloaded, pass the acceptance suite on every platform.
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            acceptance/go.sum
      - name: BusyBox, for the launcher's shell matrix (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq busybox >/dev/null
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/release"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$dir"
          cd "$dir"
          ls -l
          if command -v sha256sum >/dev/null; then sha256sum -c checksums.txt; else shasum -a 256 -c checksums.txt; fi
          chmod +x aw_*
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          case $(uname -m) in x86_64) arch=amd64 ;; arm64|aarch64) arch=arm64 ;; *) echo "unknown machine $(uname -m)"; exit 1 ;; esac
          bin="$dir/aw_${GITHUB_REF_NAME#v}_${os}_${arch}"
          "$bin" version --json
          echo "AW_ACCEPT_MIRROR=$dir" >> "$GITHUB_ENV"
          echo "AW_BIN=$bin" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@v4.1.3
        if: runner.os == 'Linux'
      - name: The signature, the provenance and go install (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.AW_ACCEPT_MIRROR }}
        run: |
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            checksums.txt
          gh attestation verify "$AW_BIN" --repo "$GITHUB_REPOSITORY"
          test -s install.sh
          GOBIN="$RUNNER_TEMP/gobin" GOFLAGS= GOPROXY=direct go install "github.com/$GITHUB_REPOSITORY/cmd/aw@$GITHUB_REF_NAME"
          "$RUNNER_TEMP/gobin/aw" version | grep -F "aw ${GITHUB_REF_NAME#v} "
      - name: Acceptance suite against the published assets
        working-directory: acceptance
        run: go test -count=1 ./...

  # bin/aw setup from a fresh clone against the published release: a clean Ubuntu container, with
  # only what R11 allows plus cosign, and a macOS runner.
  fresh-clone:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Clean ubuntu:24.04 container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$(command -v cosign):/usr/local/bin/cosign:ro" ubuntu:24.04 sh -c \
            "apt-get update -qq >/dev/null && apt-get install -y -qq git curl ca-certificates >/dev/null && sh /src/.github/scripts/fresh-clone.sh ${GITHUB_REF_NAME#v}"
      - name: macOS
        if: runner.os == 'macOS'
        run: sh .github/scripts/fresh-clone.sh "${GITHUB_REF_NAME#v}"

# A rehearsal of the release workflow's build and signing, without publishing anything or needing
# approval (plans/release-candidate.md §7). Run by hand, on a branch, before tagging:
#   gh workflow run release-dry-run.yml --ref <branch>
name: release-dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v4.1.3
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean
      - name: Check the assets
        run: sh .github/scripts/check-release-assets.sh dist
      - name: Verify the signature
        run: |
          cosign verify-blob --bundle dist/checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-dry-run.yml@$GITHUB_REF" \
            dist/checksums.txt
